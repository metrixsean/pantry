<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pantry</title>
    <script>
      // Sets the `dark` class before first paint, so the page never flashes
      // light before switching. Keep this inline and above the stylesheet.
      (function () {
        try {
          var media = window.matchMedia("(prefers-color-scheme: dark)");
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" || (stored !== "light" && media.matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Drop a favicon.png into frontend/static/ and link it here:
         <link rel="icon" href="%sveltekit.assets%/favicon.png" />
         Everything in that directory is copied to the site root verbatim. -->
    <!-- Keep this inside <head>: `xanosdk deploy --static-env` injects the
         backend URL here as a window global that frontend/src/lib/api.ts reads. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
